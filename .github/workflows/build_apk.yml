name: Compilar APK de Lista de la Compra

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias de Python y Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet requests firebase-admin

      - name: Compilar APK
        run: |
          yes | flet build apk --module-name app_compartida .

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ListaCompraApp-APK
          path: build/apk/*.apk
