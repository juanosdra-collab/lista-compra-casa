name: Compilar APK de Lista de la Compra

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Instalar dependencias de Python y Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0 requests firebase-admin

      - name: Compilar APK
        run: |
          flet build apk app_compartida.py

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ListaCompraApp-APK
          path: build/apk/*.apk
